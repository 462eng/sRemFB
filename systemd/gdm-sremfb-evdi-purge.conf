# sRemFB : supprimer les devices EVDI avant le démarrage de GDM.
# evdi est chargé au boot (modules-load.d) avec initial_device_count :
# sans cette purge, gnome-shell saisit ces cartes à l'ouverture de
# session, puis sremfb-server les régénère à son premier démarrage
# (sremfb_evdi_reset) et les retire de sous mutter — « Failed to reopen
# cardN: EBUSY », plus aucun connecteur ne s'allume jusqu'au recyclage
# de la session. Purgées ici, le serveur recrée des cartes neuves que
# mutter découvre à chaud. Le « - » rend l'étape facultative (evdi absent).
[Service]
ExecStartPre=-/bin/sh -c "echo 1 > /sys/devices/evdi/remove_all"
